name: Contributor SLOC

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *' # Daily at 06:17 UTC+8

permissions:
  contents: write
  actions: write

concurrency:
  group: contributor-report
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restore repository Git caches
        uses: actions/cache@v6.1.0
        with:
          path: sources
          key: contributor-sources-v4

      - name: Install jq
        run: command -v jq

      - name: Checkout target repositories
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources
          token="${CROSS_REPO_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo 'No checkout token is available. Configure the CROSS_REPO_TOKEN organization secret for private targets.' >&2
            exit 1
          fi
          while IFS= read -r repository; do
            if [ -d "sources/${repository}/.git" ]; then
              git -C "sources/${repository}" remote set-url origin "https://x-access-token:${token}@github.com/ClosedWHU/${repository}.git"
              git -C "sources/${repository}" fetch --quiet --prune origin "+refs/heads/main:refs/remotes/origin/main"
            else
              git -c advice.detachedHead=false clone --quiet --no-tags --no-checkout \
                "https://x-access-token:${token}@github.com/ClosedWHU/${repository}.git" "sources/${repository}"
            fi
            git -C "sources/${repository}" checkout --quiet --detach origin/main
            commit_count=$(git -C "sources/${repository}" rev-list --count HEAD)
            if [ "$commit_count" -le 0 ]; then
              echo "Repository ${repository} has no reachable commits after checkout." >&2
              exit 1
            fi
            echo "${repository}: ${commit_count} commits"
            # Remove the temporary credential before the sources directory is
            # saved into the Actions cache.
            git -C "sources/${repository}" remote set-url origin "https://github.com/ClosedWHU/${repository}.git"
          done < <(jq -r '.[]' repos.json)

      - name: Verify Git lineage behavior
        run: python3 -B -m unittest discover -s tool -p 'test_*.py' -v

      - name: Aggregate local diffs
        run: python3 tool/aggregate_local_git.py --sources sources --repos repos.json --output contributor-sloc

      - name: Publish report and prune history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/publish_report.py

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: contributor-sloc-report
          path: contributor-sloc.*
