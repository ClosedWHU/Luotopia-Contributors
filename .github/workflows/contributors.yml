name: Contributor SLOC

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore repository Git caches
        uses: actions/cache@v4
        with:
          path: sources
          key: contributor-sources-v1

      - name: Install jq
        run: command -v jq

      - name: Checkout target repositories
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources
          token="${CROSS_REPO_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo 'No checkout token is available. Configure the CROSS_REPO_TOKEN organization secret for private targets.' >&2
            exit 1
          fi
          while IFS= read -r repository; do
            if [ -d "sources/${repository}/.git" ]; then
              git -C "sources/${repository}" remote set-url origin "https://x-access-token:${token}@github.com/ClosedWHU/${repository}.git"
              git -C "sources/${repository}" fetch --quiet --prune origin main
            else
              git -c advice.detachedHead=false clone --quiet --no-tags --filter=blob:none --no-checkout \
                "https://x-access-token:${token}@github.com/ClosedWHU/${repository}.git" "sources/${repository}"
            fi
            git -C "sources/${repository}" sparse-checkout init --no-cone
            git -C "sources/${repository}" sparse-checkout set --stdin < <(printf '%s\n' \
              '*.c' '*.cc' '*.cpp' '*.cs' '*.dart' '*.go' '*.h' '*.hpp' '*.java' '*.js' '*.jsx' '*.kt' '*.kts' '*.m' '*.mm' '*.php' '*.py' '*.rb' '*.rs' '*.sh' '*.swift' '*.ts' '*.tsx' '*.vue' '*.xml' '*.yaml' '*.yml')
            git -C "sources/${repository}" checkout --quiet --detach origin/main
            # Remove the temporary credential before the sources directory is
            # saved into the Actions cache.
            git -C "sources/${repository}" remote set-url origin "https://github.com/ClosedWHU/${repository}.git"
          done < <(jq -r '.[]' repos.json)

      - name: Aggregate local diffs
        run: python3 tool/aggregate_local_git.py --sources sources --repos repos.json --output contributor-sloc

      - name: Publish persistent report release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="report-${GITHUB_RUN_ID}"
          gh release create "$tag" contributor-sloc.json contributor-sloc.csv \
            --repo "$GITHUB_REPOSITORY" \
            --title "Contributor SLOC report ${GITHUB_RUN_ID}" \
            --notes "Local Git diff cancellation report generated by workflow run ${GITHUB_RUN_ID}."

      - uses: actions/upload-artifact@v4
        with:
          name: contributor-sloc-report
          path: contributor-sloc.*
